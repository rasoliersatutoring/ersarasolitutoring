  <style>
    :root{
      --bg1:#fff6fb;
      --bg2:#f3fbff;
      --bg3:#f5fff8;
      --card: rgba(255,255,255,.86);
      --card2: rgba(255,255,255,.92);
      --ink:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.10);
      --shadow: 0 18px 60px rgba(15,23,42,.12);
      --radius: 18px;

      --pink: rgba(236,72,153,.95);
      --blue: rgba(96,165,250,.95);
      --green: rgba(34,197,94,.90);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--ink);
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 12% 10%, rgba(236,72,153,.20), transparent 55%),
        radial-gradient(900px 520px at 88% 10%, rgba(96,165,250,.18), transparent 55%),
        radial-gradient(900px 520px at 50% 115%, rgba(34,197,94,.14), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    }
    .wrap{ max-width: 1080px; margin:0 auto; padding: 26px 16px 70px; }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom: 18px; flex-wrap:wrap;
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .mark{
      width:44px; height:44px; border-radius: 14px;
      background: linear-gradient(135deg, var(--pink), var(--blue));
      box-shadow: 0 18px 40px rgba(236,72,153,.20);
      display:grid; place-items:center; font-weight:900; color:#fff;
      user-select:none;
    }
    .brand h1{ margin:0; font-size: 16px; font-weight:900; letter-spacing:.2px; }
    .brand p{ margin:2px 0 0; color:var(--muted); font-weight:650; font-size: 12.5px; }

    .langToggle{
      display:flex; align-items:center; gap:8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 10px;
      box-shadow: 0 14px 34px rgba(15,23,42,.10);
      flex-wrap:wrap;
      backdrop-filter: blur(8px);
    }
    .langToggle span{ color:var(--muted); font-weight:800; font-size:12px; margin-right:6px; }
    .langToggle button{
      border:1px solid rgba(15,23,42,.12);
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:900;
      transition: transform .12s ease, background .12s ease, color .12s ease;
      font-size: 12px;
    }
    .langToggle button.active{
      background: rgba(236,72,153,.14);
      color: var(--ink);
      border-color: rgba(236,72,153,.28);
      transform: translateY(-1px);
    }

    .hero{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(10px);
    }
    .hero:before{
      content:"";
      position:absolute;
      inset:-180px -220px auto auto;
      width:360px; height:360px;
      background: radial-gradient(circle at 30% 30%, rgba(236,72,153,.24), transparent 65%);
      transform: rotate(12deg);
      pointer-events:none;
    }
    .hero h2{ margin:0 0 10px; font-size: clamp(22px, 3.2vw, 34px); line-height:1.1; }
    .hero p{ margin:0 0 14px; color: var(--muted); font-weight:650; max-width: 78ch; }
    .quote{
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px dashed rgba(236,72,153,.35);
      background: rgba(236,72,153,.07);
      font-weight:750;
    }

    .chips{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .chip{
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 12px;
      color: var(--muted);
      font-weight:800;
      font-size: 12.5px;
      box-shadow: 0 10px 26px rgba(15,23,42,.08);
      backdrop-filter: blur(8px);
    }
    .chip strong{ color: var(--ink); font-weight:950; }

    .grid{
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 16px;
      margin-top: 16px;
      align-items:start;
    }
    @media (max-width: 920px){ .grid{ grid-template-columns:1fr; } }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      backdrop-filter: blur(10px);
    }
    .card h3{ margin:0 0 10px; font-size: 16px; }
    .muted{ color: var(--muted); font-weight:650; }

    .list{ margin: 10px 0 0; padding-left: 18px; }
    .list li{ margin: 8px 0; color: var(--muted); font-weight:650; }
    .list li strong{ color: var(--ink); font-weight:950; }

    .badge{
      display:inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight:950;
      border: 1px solid rgba(96,165,250,.28);
      background: rgba(96,165,250,.10);
      margin-top: 8px;
    }

    .actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top: 10px; }
    .btn{
      flex: 1;
      min-width: 180px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      text-decoration:none;
      color: var(--ink);
      font-weight:950;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.12);
      background: var(--card2);
      box-shadow: 0 12px 30px rgba(15,23,42,.10);
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    }
    .btn:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,.96);
      box-shadow: 0 18px 44px rgba(15,23,42,.12);
    }

    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight:950;
      background: rgba(236,72,153,.14);
      border: 1px solid rgba(236,72,153,.28);
    }
    .pill.green{
      background: rgba(34,197,94,.12);
      border-color: rgba(34,197,94,.26);
    }

    .priceGrid{ display:grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    .priceItem{
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.10);
      background: var(--card2);
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      box-shadow: 0 12px 30px rgba(15,23,42,.08);
    }
    .priceItem .title{ font-weight:950; }
    .priceItem .desc{ color: var(--muted); font-weight:650; font-size: 12.5px; margin-top:3px; }
    .priceItem .price{ font-weight:950; white-space:nowrap; }

    form{ margin-top: 12px; display:grid; gap:10px; }
    .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width: 520px){ .row{ grid-template-columns:1fr; } }

    input, select, textarea{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.12);
      background: rgba(255,255,255,.92);
      outline:none;
      font: inherit;
      font-weight:650;
      box-shadow: 0 10px 24px rgba(15,23,42,.07);
    }
    textarea{ min-height: 110px; resize: vertical; }

    .send{
      border:0;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight:950;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--blue));
      border: 1px solid rgba(15,23,42,.10);

    .note{

      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.10);
      background: var(--card2);
      color: var(--muted);
      font-weight:650;
      font-size: 12.5px;

    .success{

      border-radius: 14px;

      background: rgba(34,197,94,.10);
      color: #065f46;
      font-weight:900;
      font-size: 12.5px;
    }

    footer{ text-align:center; margin-top: 16px; color: var(--muted); font-weight:650; font-size: 12.5px; }
    a.mail{ color: var(--ink); font-weight:900; text-decoration:none; border-bottom: 1px dotted rgba(15,23,42,.35); }
  </style>
</head>

      grade.appendChild(opt0);
      for(let i=1;i<=12;i++){

        grade.appendChild(o);
      }

      document.getElementById("chip1b").textContent = t.chip1b;
      document.getElementById("chip2a").textContent = t.chip2a;
      document.getElementById("chip2b").textContent = t.chip2b;
      document.getElementById("chip3a").textContent = t.chip3a;
      document.getElementById("chip3b").textContent = t.chip3b;

      document.getElementById("aboutTitle").textContent = t.aboutTitle;
      document.getElementById("aboutText").textContent = t.aboutText;

      document.getElementById("sp1").textContent = t.sp1; document.getElementById("sp1v").textContent = t.sp1v;
      document.getElementById("sp2").textContent = t.sp2; document.getElementById("sp2v").textContent = t.sp2v;
      document.getElementById("sp3").textContent = t.sp3; document.getElementById("sp3v").textContent = t.sp3v;

      document.getElementById("badgeNote").textContent = t.badgeNote;

      document.getElementById("howTitle").textContent = t.howTitle;
      const howList = document.getElementById("howList");
      howList.innerHTML = "";
      t.howList.forEach(line=>{
        const li = document.createElement("li");
        li.textContent = line;
        howList.appendChild(li);
      });

      document.getElementById("waText").textContent = t.waText;
      document.getElementById("waPill").textContent = t.waPill;
      document.getElementById("fbText").textContent = t.fbText;
      document.getElementById("fbPill").textContent = t.fbPill;
      document.getElementById("emText").textContent = t.emText;
      document.getElementById("emPill").textContent = t.emPill;
      document.getElementById("emailLine").textContent = t.emailLine;

      document.getElementById("pricesTitle").textContent = t.pricesTitle;
      document.getElementById("pricesSub").textContent = t.pricesSub;

      document.getElementById("p1t").textContent = t.p1t; document.getElementById("p1d").textContent = t.p1d; document.getElementById("p1p").textContent = t.p1p;
      document.getElementById("p2t").textContent = t.p2t; document.getElementById("p2d").textContent = t.p2d; document.getElementById("p2p").textContent = t.p2p;
      document.getElementById("p3t").textContent = t.p3t; document.getElementById("p3d").textContent = t.p3d; document.getElementById("p3p").textContent = t.p3p;
      document.getElementById("p4t").textContent = t.p4t; document.getElementById("p4d").textContent = t.p4d; document.getElementById("p4p").textContent = t.p4p;

      document.getElementById("formTitle").textContent = t.formTitle;
      document.getElementById("formSub").textContent = t.formSub;

      document.getElementById("studentName").placeholder = t.phName;
      document.getElementById("contactEmail").placeholder = t.phEmail;

      fillGrades(t.gradeLabel);
      fillSelect(document.getElementById("level"), t.levelLabel, ["Elementary","High school","Other"]);
      fillSelect(document.getElementById("subject"), t.subjectLabel, ["Math","Biology","Chemistry","Science","Calculus","Other"]);
      fillSelect(document.getElementById("mode"), t.modeLabel, ["Online","In-person","Either"]);

      document.getElementById("message").placeholder = t.messagePH;
      document.getElementById("sendBtn").textContent = t.sendBtn;
      document.getElementById("note").innerHTML = t.note;
      document.getElementById("sentMsg").textContent = t.sentMsg;

      ["EN","AR","FA","UR","HI"].forEach(code=>{
        document.getElementById("btn"+code).classList.toggle("active", code.toLowerCase() === lang);
      });
    }

    document.getElementById("btnEN").onclick = ()=>applyText("en");
    document.getElementById("btnAR").onclick = ()=>applyText("ar");
    document.getElementById("btnFA").onclick = ()=>applyText("fa");
    document.getElementById("btnUR").onclick = ()=>applyText("ur");
    document.getElementById("btnHI").onclick = ()=>applyText("hi");
    applyText("en");

    // ✅ Formspree submit (no redirect)
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("tutorForm");
      const sent = document.getElementById("sentMsg");
      const sendBtn = document.getElementById("sendBtn");
      if (!form) return;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        sent.style.display = "none";

        sendBtn.disabled = true;
        const original = sendBtn.textContent;
        sendBtn.textContent = "Sending...";

        const data = new FormData(form);

        try {
          const res = await fetch(form.action, {
            method: "POST",
            body: data,
            headers: { "Accept": "application/json" }
          });

          if (res.ok) {
            form.reset();
            sent.style.display = "block";
            sent.scrollIntoView({ behavior: "smooth", block: "center" });
          } else {
            alert("Something went wrong. Please try again, or message on WhatsApp.");
          }
        } catch (err) {
          alert("Blocked request / no internet. Please try again, or message on WhatsApp.");
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = original;
        }
      });
    });
  </script>
